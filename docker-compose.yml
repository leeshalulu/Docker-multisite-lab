
services:
  proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - ./npm-data:/data
      - ./npm-letsencrypt:/etc/letsencrypt
    networks:
      - webnet

  company-a:
    image: nginx:alpine
    container_name: company-a
    restart: unless-stopped
    volumes:
      - ./company:/usr/share/nginx/html:ro
    networks:
      - webnet

  portal-b:
    image: nginx:alpine
    container_name: portal-b
    restart: unless-stopped
    volumes:
      - ./portal:/usr/share/nginx/html:ro
    networks:
      - webnet

  common-a:
    image: nginx:alpine
    container_name: common-a
    restart: unless-stopped
    volumes:
      - ./common-a:/usr/share/nginx/html:ro
    networks:
      - webnet

  common-b:
    image: nginx:alpine
    container_name: common-b
    restart: unless-stopped
    volumes:
      - ./common-b:/usr/share/nginx/html:ro
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

